<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="signupForm" novalidate data-redirect="../index.html">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
            <span id="usernameError" class="error-text"></span>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="user@example.com">
            <span id="emailError" class="error-text"></span>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters">
            <span id="passwordError" class="error-text"></span>
        </div>

        <a href="../index.html" class="submit-btn" id="submitBtn" role="button">Sign Up</a>
    </form>
    
    <script src="script.js"></script>
</body>
</html>
