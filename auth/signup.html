<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="site-nav" aria-label="Main navigation">
        <a class="site-nav__brand" href="../index.html" aria-label="Shortly home">
            <img src="../images/logo.svg" alt="Shortly">
        </a>
        <div class="site-nav__menu" id="siteNavMenu">
            <div class="site-nav__links">
                <a href="../pages/features.html">Features</a>
                <a href="../pages/pricing.html">Pricing</a>
                <a href="../pages/resources.html">Resources</a>
            </div>
            <div class="site-nav__actions">
                <a href="login.html">Login</a>
                <a class="site-nav__signup" href="signup.html" aria-current="page">Sign Up</a>
            </div>
        </div>
    </nav>

    <form id="signupForm" novalidate data-redirect="../index.html">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
            <span id="usernameError" class="error-text"></span>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="user@example.com">
            <span id="emailError" class="error-text"></span>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters">
            <span id="passwordError" class="error-text"></span>
        </div>

        <a href="#" class="submit-btn" id="submitBtn" role="button">Sign Up</a>

        <p class="form-footer">
            Already a member? <a href="login.html">Sign in</a>
        </p>
    </form>
    
    <script src="script.js"></script>
</body>
</html>
